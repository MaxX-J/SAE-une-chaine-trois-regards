<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="770" viewBox="0 0 1300 770" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Segoe UI, Arial, sans-serif">
  <title>Architecture de noeud-b</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1C2140"/>
    </marker>
    <style>
      .b{fill:#FBF8F1;stroke:#1C2140;stroke-width:2}
      .c{fill:#F2B134;stroke:#1C2140;stroke-width:2.5}
      .x{fill:#E8DFCB;stroke:#1C2140;stroke-width:2}
      .t{font-size:19px;font-weight:700;fill:#1C2140}
      .s{font-size:14px;fill:#5C5A66}
      .l{font-size:14px;fill:#1C2140;font-family:JetBrains Mono, Consolas, monospace}
      .a{stroke:#1C2140;stroke-width:2;fill:none;marker-end:url(#f)}
      .d{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1300" height="770" fill="#F6F1E6"/>

  <!-- processus noeud-b -->
  <rect x="320" y="150" width="920" height="430" rx="14" fill="none" stroke="#1C2140" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="340" y="178" class="l">Processus noeud-b (Node.js, ordinateur du binôme)</text>

  <!-- navigateur -->
  <rect x="740" y="28" width="280" height="68" rx="10" class="x"/>
  <text x="880" y="58" text-anchor="middle" class="t">Application web</text>
  <text x="880" y="80" text-anchor="middle" class="s">navigateur du visiteur</text>

  <!-- boîtes du processus -->
  <rect x="740" y="196" width="280" height="62" rx="10" class="b"/>
  <text x="880" y="223" text-anchor="middle" class="t">API application</text>
  <text x="880" y="245" text-anchor="middle" class="s">filtre, limite par visiteur</text>

  <rect x="360" y="318" width="200" height="72" rx="10" class="b"/>
  <text x="460" y="347" text-anchor="middle" class="t">API entre nœuds</text>
  <text x="460" y="370" text-anchor="middle" class="s">5 routes, port 8080</text>

  <rect x="640" y="318" width="240" height="72" rx="10" class="c"/>
  <text x="760" y="347" text-anchor="middle" class="t">Module chaîne</text>
  <text x="760" y="370" text-anchor="middle" class="s" style="fill:#1C2140">valide, signe, produit</text>

  <rect x="980" y="318" width="220" height="72" rx="10" class="b"/>
  <text x="1090" y="347" text-anchor="middle" class="t">Module œuvre</text>
  <text x="1090" y="370" text-anchor="middle" class="s">balades, quartiers</text>

  <rect x="360" y="462" width="200" height="66" rx="10" class="b"/>
  <text x="460" y="490" text-anchor="middle" class="t">Worker IA</text>
  <text x="460" y="512" text-anchor="middle" class="s">tâche de fond, par lots</text>

  <rect x="1000" y="462" width="200" height="66" rx="10" class="b"/>
  <text x="1100" y="490" text-anchor="middle" class="t">Données de ville</text>
  <text x="1100" y="512" text-anchor="middle" class="s">OpenStreetMap, fichiers</text>

  <!-- hors du processus -->
  <rect x="40" y="318" width="220" height="72" rx="10" class="x"/>
  <text x="150" y="347" text-anchor="middle" class="t">noeud-a, noeud-c</text>
  <text x="150" y="370" text-anchor="middle" class="s">les deux autres binômes</text>

  <rect x="360" y="640" width="200" height="66" rx="10" class="x"/>
  <text x="460" y="668" text-anchor="middle" class="t">OpenRouter</text>
  <text x="460" y="690" text-anchor="middle" class="s">modèles d'IA gratuits</text>

  <!-- base SQLite : cylindre -->
  <path d="M660 652 v62 a100 18 0 0 0 200 0 v-62" fill="#E8DFCB" stroke="#1C2140" stroke-width="2"/>
  <ellipse cx="760" cy="652" rx="100" ry="18" fill="#FBF8F1" stroke="#1C2140" stroke-width="2"/>
  <text x="760" y="700" text-anchor="middle" class="t">Base SQLite</text>

  <!-- flèches -->
  <line x1="850" y1="96" x2="850" y2="194" class="a"/>
  <text x="838" y="124" text-anchor="end" class="l">HTTP</text>
  <line x1="910" y1="196" x2="910" y2="98" class="a d"/>
  <text x="922" y="124" class="l">SSE</text>

  <line x1="800" y1="258" x2="772" y2="316" class="a"/>
  <line x1="960" y1="258" x2="1050" y2="316" class="a"/>

  <line x1="260" y1="354" x2="358" y2="354" class="a"/>
  <line x1="560" y1="354" x2="638" y2="354" class="a"/>
  <path d="M700 318 V290 H150 V316" class="a"/>
  <text x="425" y="282" text-anchor="middle" class="l">HTTP sur Tailscale</text>

  <line x1="1100" y1="390" x2="1100" y2="460" class="a"/>
  <line x1="760" y1="390" x2="760" y2="632" class="a"/>
  <line x1="1030" y1="390" x2="848" y2="640" class="a"/>
  <line x1="540" y1="528" x2="680" y2="642" class="a"/>
  <line x1="460" y1="528" x2="460" y2="638" class="a"/>
  <text x="472" y="616" class="l">HTTPS</text>
</svg>
